name: 🔄 Sync Upstream & Deploy

# 自动跟随上游 maillab/cloud-mail：
#   1) 每天定时拉取上游 main 并合并到本仓库
#   2) 同步到新提交后，触发 deploy-cloudflare.yml 完成部署
# 手动触发：Actions → Sync Upstream & Deploy → Run workflow
#
# 说明：本仓库由上游历史重写前的快照演化而来，与上游没有共同祖先，
# 因此 GitHub 原生的 "Sync fork" 按钮无法使用。本 workflow 承担该职责。
on:
  schedule:
    - cron: '0 19 * * *' # UTC 19:00 = 北京时间 03:00
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: 🧬 Sync & Deploy
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: 🚚 检出仓库 / Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🧬 同步上游 / Sync upstream
        id: sync
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/maillab/cloud-mail.git 2>/dev/null || true
          git fetch upstream main --no-tags

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "✅ 已是最新，无需同步"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "📥 发现上游新提交，开始同步..."
          if git merge --no-edit -m "chore: sync upstream/main ($(date -u +%Y-%m-%d))" upstream/main; then
            echo "🔀 merge 完成"
          else
            # 上游若再次重写历史会失去共同祖先，此时 merge 必然冲突：
            # 直接重置到上游，并把本 workflow 文件重新加回去。
            echo "⚠️ 与上游分叉（上游可能重写过历史），改用重置策略"
            git merge --abort || true
            cp .github/workflows/sync-upstream.yml /tmp/sync-upstream.yml
            git reset --hard upstream/main
            mkdir -p .github/workflows
            cp /tmp/sync-upstream.yml .github/workflows/sync-upstream.yml
            git add .github/workflows/sync-upstream.yml
            git commit -m "ci: restore sync workflow after upstream history rewrite"
          fi

          git push origin HEAD:main --force
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 🚀 触发部署 / Trigger deploy
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 用 GITHUB_TOKEN 推送不会级联触发其它 workflow，因此这里显式派发
        run: |
          gh workflow run deploy-cloudflare.yml --repo "${{ github.repository }}" --ref main
          echo "🚀 已触发 deploy-cloudflare.yml"
